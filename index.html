<body>
<header><div class="hrow">
  <h1>Investment Agent<span class="status" id="status">Not run yet</span></h1>
  <button class="btn sm" id="refresh">Refresh</button>
</div></header>

<main>
  <section id="tab-signals"></section>
  <section id="tab-backtest" hidden></section>
  <section id="tab-log" hidden></section>
  <section id="tab-settings" hidden></section>
</main>

<nav><div class="tabs" role="tablist">
  <button role="tab" data-tab="signals" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Signals</button>
  <button role="tab" data-tab="backtest" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><path d="M3 4v7h7"/></svg>Backtest</button>
  <button role="tab" data-tab="log" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Log</button>
  <button role="tab" data-tab="settings" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Settings</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/*
 * Investment Agent app v0.2 - read-only.
 * Same rules as agent.py v0.1: downloads public Binance data straight from
 * this phone, applies three trend rules, backtests them, and sizes positions.
 * It has no API key and cannot place trades.
 */
const VERSION = "0.2";
const DAY = 86400000;

const DEFAULTS = {
  portfolio_usdt: 1000,
  risk_per_trade_pct: 1.0,
  max_position_pct: 20,
  watchlist: [
    {symbol: "BTCUSDT", market: "spot"},
    {symbol: "ETHUSDT", market: "spot"},
    {symbol: "XAUUSDT", market: "futures"},
    {symbol: "TSLAUSDT", market: "futures"},
    {symbol: "NVDAUSDT", market: "futures"},
    {symbol: "QQQUSDT", market: "futures"}
  ],
  strategy: {fast_sma_days: 50, slow_sma_days: 200, momentum_days: 90, atr_days: 14, stop_atr_multiple: 2.5},
  fee_pct_per_trade: 0.1,
  funding_warning_annual_pct: 15,
  history_days: 2000,
  endpoints: {spot: "https://api.binance.com", futures: "https://fapi.binance.com"}
};

const SIGNAL_TEXT = {IN: "HOLD / BUY", WAIT: "WAIT", OUT: "STAY OUT", NO_DATA: "NOT ENOUGH HISTORY", ERROR: "DATA ERROR"};
const SESSION_LABELS = {REGULAR: "open (regular hours)", PRE_MARKET: "pre-market", AFTER_MARKET: "after-hours",
  OVERNIGHT: "overnight session", NO_TRADING: "closed"};
const UNDERLYING_LABELS = {EQUITY: "Equity", COMMODITY: "Commodity", KR_EQUITY: "Korean equity",
  HK_EQUITY: "Hong Kong equity", CN_EQUITY: "China equity", FX: "Forex"};

/* ---------- storage (works when hosted on your own site; fails safely) ---------- */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem("ia." + key); return v == null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem("ia." + key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function loadConfig() {
  const saved = store.get("config", null);
  const cfg = clone(DEFAULTS);
  if (saved && typeof saved === "object") {
    for (const k of Object.keys(DEFAULTS)) {
      if (k === "strategy" || k === "endpoints") Object.assign(cfg[k], saved[k] || {});
      else if (saved[k] !== undefined) cfg[k] = saved[k];
    }
  }
  return cfg;
}
let CFG = loadConfig();

/* ---------- formatting ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function fmtPrice(x) {
  if (x >= 100) return x.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  if (x >= 1) return x.toLocaleString("en-US", {minimumFractionDigits: 3, maximumFractionDigits: 3});
  return Number(x.toPrecision(6)).toString();
}
function fmtPct(x, signed = true, digits = 1) {
  const s = Math.abs(x).toFixed(digits);
  const neg = x < 0 && Number(s) !== 0;
  return (neg ? "-" : (signed ? "+" : "")) + s + "%";
}
const fmtUsdt = x => Math.round(x).toLocaleString("en-US");
const utcDate = ms => new Date(ms).toISOString().slice(0, 10);
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 24) return h + " h ago";
  return Math.round(h / 24) + " days ago";
}

/* ---------- 1. DATA ---------- */
class AgentError extends Error {}
const unreachable = {};

async function getJSON(base, path, params, retries = 3) {
  if (unreachable[base]) throw new AgentError(unreachable[base]);
  const url = base.replace(/\/+$/, "") + path + (params ? "?" + new URLSearchParams(params) : "");
  let problem = "unknown problem", offline = false;
  for (let attempt = 0; attempt < retries; attempt++) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 25000);
    try {
      const res = await fetch(url, {signal: ctl.signal});
      clearTimeout(timer);
      if (res.ok) {
        try { return await res.json(); } catch (e) { problem = "Binance sent a reply that was not valid JSON"; }
      } else if (res.status === 418 || res.status === 429 || res.status >= 500) {
        problem = "Binance is busy (HTTP " + res.status + ")";
      } else if (res.status === 403 || res.status === 451) {
        throw new AgentError("Binance refused the connection (HTTP " + res.status + "). It blocks some " +
          "countries and networks. Try a different connection, e.g. mobile data instead of Wi-Fi.");
      } else {
        let msg = "";
        try { msg = (await res.json()).msg || ""; } catch (e) {}
        throw new AgentError("Binance said: " + (msg || "error") + " (HTTP " + res.status + ")");
      }
    } catch (e) {
      clearTimeout(timer);
      if (e instanceof AgentError) throw e;
      problem = e.name === "AbortError" ? "Binance took too long to answer" :
        "Could not reach Binance. Check your internet connection. Some office or public Wi-Fi networks block it; try mobile data.";
      offline = true;
    }
    if (attempt < retries - 1) await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
  }
  if (offline) unreachable[base] = problem;
  throw new AgentError(problem);
}

async function fetchCandles(market, symbol, days) {
  const base = market === "spot" ? CFG.endpoints.spot : CFG.endpoints.futures;
  const path = market === "spot" ? "/api/v3/klines" : "/fapi/v1/klines";
  const page = market === "spot" ? 1000 : 1500;
  const rows = new Map();
  let endTime = null;
  const wanted = days + 1;
  while (rows.size < wanted) {
    const limit = Math.min(page, wanted - rows.size);
    const params = {symbol, interval: "1d", limit};
    if (endTime !== null) params.endTime = endTime;
    const batch = await getJSON(base, path, params);
    if (!Array.isArray(batch) || !batch.length) break;
    const before = rows.size;
    for (const r of batch) rows.set(Number(r[0]), r);
    if (batch.length < limit || rows.size === before) break;
    endTime = Number(batch[0][0]) - 1;
  }
  const now = Date.now();
  return [...rows.keys()].sort((a, b) => a - b)
    .map(k => rows.get(k))
    .filter(r => Number(r[6]) < now)
    .map(r => ({open_time: Number(r[0]), high: +r[2], low: +r[3], close: +r[4]}));
}

async function fetchCatalogue() {
  const info = await getJSON(CFG.endpoints.futures, "/fapi/v1/exchangeInfo");
  const out = {};
  for (const s of (info && info.symbols) || []) out[s.symbol] = s;
  return out;
}

async function fetchFunding(symbol, days = 30) {
  const now = Date.now();
  const rows = await getJSON(CFG.endpoints.futures, "/fapi/v1/fundingRate",
    {symbol, startTime: now - days * DAY, limit: 1000});
  if (!Array.isArray(rows) || !rows.length) return null;
  const total = rows.reduce((a, r) => a + Number(r.fundingRate), 0);
  const span = Math.max(1, (now - Number(rows[0].fundingTime)) / DAY);
  return {total_pct: total * 100, span_days: span, annual_pct: total * 100 / span * 365};
}

async function fetchSessions() {
  const d = await getJSON(CFG.endpoints.futures, "/fapi/v1/tradingSchedule");
  return (d && d.marketSchedules) || {};
}

function currentSession(schedules, underlying) {
  const m = schedules[String(underlying || "").toUpperCase()];
  if (!m) return null;
  const now = Date.now();
  for (const s of m.sessions || []) {
    if (Number(s.startTime || 0) <= now && now < Number(s.endTime || 0)) {
      return SESSION_LABELS[s.type] || (s.type ? s.type.toLowerCase() : null);
    }
  }
  return null;
}

/* ---------- 2. SIGNALS ---------- */
function ruleStates(closes, st) {
  const fast = st.fast_sma_days, slow = st.slow_sma_days, mom = st.momentum_days;
  const n = closes.length, prefix = [0];
  for (const c of closes) prefix.push(prefix[prefix.length - 1] + c);
  const sma = (t, w) => (prefix[t + 1] - prefix[t + 1 - w]) / w;
  const first = Math.max(slow - 1, fast - 1, mom);
  const out = new Array(n).fill(null);
  for (let t = first; t < n; t++) {
    const f = sma(t, fast), s = sma(t, slow), m = closes[t] / closes[t - mom] - 1;
    const a = closes[t] > s, b = f > s, c = m > 0;
    out[t] = {state: a && b && c ? "IN" : (!a ? "OUT" : "WAIT"), a, b, c, sma_fast: f, sma_slow: s, momentum: m};
  }
  return out;
}

function averageTrueRange(candles, days) {
  if (candles.length < days + 1) return null;
  let sum = 0;
  for (let i = candles.length - days; i < candles.length; i++) {
    const pc = candles[i - 1].close, h = candles[i].high, l = candles[i].low;
    sum += Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
  }
  return sum / days;
}

function annualVolatility(closes, days = 30) {
  if (closes.length < days + 1) return null;
  const logs = [];
  for (let i = closes.length - days; i < closes.length; i++) logs.push(Math.log(closes[i] / closes[i - 1]));
  const mean = logs.reduce((a, b) => a + b, 0) / days;
  const v = logs.reduce((a, x) => a + (x - mean) ** 2, 0) / (days - 1);
  return Math.sqrt(v) * Math.sqrt(365) * 100;
}

function positionSize(close, atr) {
  if (!atr || atr <= 0) return null;
  const portfolio = Number(CFG.portfolio_usdt);
  const dist = CFG.strategy.stop_atr_multiple * atr;
  const stop = close - dist;
  if (stop <= 0) return null;
  const byRisk = portfolio * CFG.risk_per_trade_pct / 100 / (dist / close);
  const cap = portfolio * CFG.max_position_pct / 100;
  const size = Math.min(byRisk, cap);
  return {usdt: size, pct_of_portfolio: size / portfolio * 100, stop_price: stop, stop_pct: dist / close * 100,
    loss_if_stopped: size * dist / close, capped: byRisk > cap};
}

/* ---------- 3. BACKTEST ---------- */
function backtest(closes, states, feePct) {
  const start = states.findIndex(s => s !== null);
  if (start < 0) return null;
  const days = closes.length - 1 - start;
  if (days < 30) return null;
  const fee = feePct / 100;
  let rule = 1, hold = 1 - fee, rp = 1, hp = hold, rdd = 0, hdd = 0, pos = 0, entries = 0, inDays = 0;
  for (let t = start; t < closes.length - 1; t++) {
    const target = states[t].state === "IN" ? 1 : 0;
    if (target !== pos) { rule *= 1 - fee; if (target === 1) entries++; pos = target; }
    const move = closes[t + 1] / closes[t] - 1;
    if (pos) { rule *= 1 + move; inDays++; }
    hold *= 1 + move;
    rp = Math.max(rp, rule); hp = Math.max(hp, hold);
    rdd = Math.min(rdd, rule / rp - 1); hdd = Math.min(hdd, hold / hp - 1);
  }
  return {start_index: start, days, rule_return_pct: (rule - 1) * 100, hold_return_pct: (hold - 1) * 100,
    rule_drawdown_pct: rdd * 100, hold_drawdown_pct: hdd * 100, entries, time_in_market_pct: inDays / days * 100};
}

/* ---------- one asset ---------- */
function describeKind(market, contract) {
  if (market === "spot") return ["Spot crypto (you own the coin)", false];
  if (contract && String(contract.contractType || "").toUpperCase().includes("TRADIFI")) {
    const u = String(contract.underlyingType || "").toUpperCase();
    const label = UNDERLYING_LABELS[u] || u.replace(/_/g, " ").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    return [label ? "TradFi perpetual future (" + label + ")" : "TradFi perpetual future", true];
  }
  return ["Crypto perpetual future", false];
}

function explain(s) {
  const st = CFG.strategy, slow = st.slow_sma_days, fast = st.fast_sma_days, mom = st.momentum_days;
  const checks = [
    [s.a, `price is above its ${slow}-day average`, `price is below its ${slow}-day average`],
    [s.b, `the ${fast}-day average is above the ${slow}-day`, `the ${fast}-day average is below the ${slow}-day`],
    [s.c, `the ${mom}-day return is positive (${fmtPct(s.momentum * 100)})`,
          `the ${mom}-day return is negative (${fmtPct(s.momentum * 100)})`]
  ];
  if (s.state === "IN") return "All three rules pass: " + checks.map(c => c[1]).join("; ") + ".";
  if (s.state === "OUT") return `The long-term trend is down: ${checks[0][2]}. The rules stay out until that changes.`;
  return "Mixed picture. Passing: " + checks.filter(c => c[0]).map(c => c[1]).join("; ") +
    ". Failing: " + checks.filter(c => !c[0]).map(c => c[2]).join("; ") + ". The rules wait for all three.";
}

async function analyseAsset(item, catalogue, schedules) {
  const symbol = String(item.symbol).toUpperCase().trim();
  const market = String(item.market || "spot").toLowerCase().trim();
  const r = {symbol, market, state: "ERROR", notes: [], kind: market === "spot" ? "Spot crypto" : "Perpetual future", is_tradfi: false};
  let contract = null;
  if (market === "futures" && catalogue) {
    contract = catalogue[symbol];
    if (!contract) {
      r.explanation = symbol + " is not listed on Binance Futures. Check the spelling, or pick one from Settings > Browse TradFi contracts.";
      return r;
    }
    if (contract.status !== "TRADING") r.notes.push("Contract status on Binance is " + contract.status + ", not TRADING.");
  }
  [r.kind, r.is_tradfi] = describeKind(market, contract);

  let candles;
  try { candles = await fetchCandles(market, symbol, Number(CFG.history_days)); }
  catch (e) { r.explanation = e.message; return r; }
  if (!candles.length) { r.explanation = "Binance returned no price history for this symbol."; return r; }

  const st = CFG.strategy;
  const closes = candles.map(c => c.close);
  r.close = closes[closes.length - 1];
  r.data_date = utcDate(candles[candles.length - 1].open_time);
  r.history_days = closes.length;
  const age = (Date.now() - candles[candles.length - 1].open_time) / DAY;
  if (age > 3) r.notes.push("Latest price is " + Math.round(age) + " days old; the market may be suspended.");

  const states = ruleStates(closes, st);
  const latest = states[states.length - 1];
  const needed = Math.max(st.slow_sma_days, st.fast_sma_days, st.momentum_days + 1);
  if (!latest) {
    r.state = "NO_DATA";
    r.explanation = `Only ${closes.length} days of price history exist; the rules need ${needed}. No signal until then.`;
  } else {
    r.state = latest.state;
    r.explanation = explain(latest);
    r.sma_fast = latest.sma_fast; r.sma_slow = latest.sma_slow; r.momentum_pct = latest.momentum * 100;
  }
  r.volatility_pct = annualVolatility(closes);
  if (r.state === "IN") r.size = positionSize(r.close, averageTrueRange(candles, st.atr_days));

  const bt = backtest(closes, states, Number(CFG.fee_pct_per_trade));
  if (bt) { bt.from_date = utcDate(candles[bt.start_index].open_time); bt.to_date = r.data_date; }
  r.backtest = bt;

  if (market === "futures") {
    try { r.funding = await fetchFunding(symbol); }
    catch (e) { r.funding = null; r.notes.push("Funding cost unavailable: " + e.message); }
    if (r.funding && r.funding.annual_pct > Number(CFG.funding_warning_annual_pct)) {
      r.notes.push("Expensive to hold: buyers have been paying about " + Math.round(r.funding.annual_pct) + "% a year in funding.");
    }
    if (r.is_tradfi && contract) {
      r.session = currentSession(schedules, contract.underlyingType);
      if (r.session && !r.session.startsWith("open")) {
        r.notes.push("The underlying market is outside regular hours right now (" + r.session + "). The contract " +
          "still trades, but prices are thinner and can gap when the market reopens.");
      }
    }
  }
  return r;
}

function capTotalExposure(results) {
  const sized = results.filter(r => r.size);
  let total = sized.reduce((a, r) => a + r.size.usdt, 0);
  const portfolio = Number(CFG.portfolio_usdt);
  if (total > portfolio && portfolio > 0) {
    const k = portfolio / total;
    for (const r of sized) {
      for (const key of ["usdt", "pct_of_portfolio", "loss_if_stopped"]) r.size[key] *= k;
      r.size.scaled = true;
    }
    total = portfolio;
  }
  return total;
}

async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() { while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); } }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, worker));
  return out;
}

/* ---------- log ---------- */
const LOG_COLUMNS = ["run_time_utc", "data_date", "symbol", "market", "kind", "close", "signal", "sma_fast", "sma_slow",
  "momentum_pct", "volatility_pct", "funding_annual_pct", "suggested_usdt", "stop_price"];
const LOG_LIMIT = 5000;

function appendLog(results) {
  const log = store.get("log", []);
  const seen = new Set(log.map(r => r.data_date + "|" + r.symbol + "|" + r.market));
  const run = new Date().toISOString().slice(0, 16).replace("T", " ");
  const num = (v, d = 6) => v == null ? "" : Number(v.toFixed(d));
  let added = 0;
  for (const r of results) {
    if (!r.data_date || seen.has(r.data_date + "|" + r.symbol + "|" + r.market)) continue;
    const s = r.size || {};
    log.push({run_time_utc: run, data_date: r.data_date, symbol: r.symbol, market: r.market, kind: r.kind,
      close: r.close, signal: SIGNAL_TEXT[r.state], sma_fast: num(r.sma_fast), sma_slow: num(r.sma_slow),
      momentum_pct: num(r.momentum_pct, 2), volatility_pct: num(r.volatility_pct, 1),
      funding_annual_pct: num(r.funding && r.funding.annual_pct, 2), suggested_usdt: num(s.usdt, 2),
      stop_price: num(s.stop_price)});
    added++;
  }
  while (log.length > LOG_LIMIT) log.shift();
  store.set("log", log);
  return added;
}

function logCSV() {
  const log = store.get("log", []);
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [LOG_COLUMNS.join(",")].concat(log.map(r => LOG_COLUMNS.map(c => q(r[c])).join(","))).join("\n");
}

/* ---------- running ---------- */
let LAST = store.get("last", null);
let CATALOGUE = null;
let running = false;

async function runAgent() {
  if (running) return;
  running = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Running';
  for (const k of Object.keys(unreachable)) delete unreachable[k];
  const problems = [];
  let schedules = {};
  try {
    const usesFutures = CFG.watchlist.some(i => String(i.market).toLowerCase() === "futures");
    if (usesFutures) {
      setStatus("Loading futures contract list...");
      try { CATALOGUE = await fetchCatalogue(); }
      catch (e) { CATALOGUE = null; problems.push("Could not load the futures contract list: " + e.message); }
      try { schedules = await fetchSessions(); } catch (e) { schedules = {}; }
    }
    let done = 0;
    setStatus(`Analysing 0 of ${CFG.watchlist.length}...`);
    const results = await pool(CFG.watchlist, 3, async item => {
      const r = await analyseAsset(item, CATALOGUE, schedules);
      done++;
      setStatus(`Analysing ${done} of ${CFG.watchlist.length}...`);
      return r;
    });
    if (results.length && results.every(r => r.state === "ERROR")) {
      LAST = {ran_at: Date.now(), results, total: 0, problems, failed: true};
    } else {
      const total = capTotalExposure(results);
      LAST = {ran_at: Date.now(), results, total, problems, portfolio: Number(CFG.portfolio_usdt)};
      const added = appendLog(results);
      if (added) toast(added + " new signal" + (added > 1 ? "s" : "") + " logged");
    }
    store.set("last", LAST);
  } catch (e) {
    LAST = {ran_at: Date.now(), results: [], problems: ["Unexpected problem: " + e.message], failed: true};
  } finally {
    running = false;
    btn.disabled = false;
    btn.textContent = "Refresh";
    renderAll();
  }
}

function renderBacktest() {
  const el = document.getElementById("tab-backtest");

    const yrs = b.days / 365;

    const safer = b.rule_drawdown_pct > b.hold_drawdown_pct;
    const verdict = beat
      ? (safer ? "The rules returned more, with a smaller worst drop." : "The rules returned more, but with a deeper worst drop.")
      : (safer ? "Buy-and-hold returned more. The rules had a smaller worst drop." : "Buy-and-hold returned more, with a smaller worst drop.");
    h += `<div class="bt"><div class="head"><strong>${esc(r.symbol)}</strong>` +
      `<span class="small">since ${esc(b.from_date)} (${yrs.toFixed(1)} yrs)</span></div>` +

      `<div class="row"><span>Buy &amp; hold: return</span><span>${fmtPct(b.hold_return_pct, true, 0)}</span></div>` +

      `<div class="row"><span>Buy &amp; hold: worst drop</span><span>${fmtPct(b.hold_drawdown_pct, true, 0)}</span></div>` +

async function loadTradfi() {
  const box = document.getElementById("tflist");
  try {
    if (!CATALOGUE) CATALOGUE = await fetchCatalogue();
  } catch (e) { box.textContent = e.message; delete unreachable[CFG.endpoints.futures]; return; }
  const groups = {};
  for (const [sym, c] of Object.entries(CATALOGUE)) {
    if (!String(c.contractType || "").toUpperCase().includes("TRADIFI") || c.status !== "TRADING") continue;
    const u = String(c.underlyingType || "OTHER").toUpperCase();
    (groups[u] = groups[u] || []).push(sym);
  }
  const keys = Object.keys(groups).sort();
  if (!keys.length) { box.textContent = "No TradFi contracts found."; return; }
  const on = new Set(CFG.watchlist.filter(w => w.market === "futures").map(w => w.symbol));
  box.innerHTML = '<p class="small">Tap to add or remove. All are leveraged perpetual futures; the app assumes 1x.</p>' +
    keys.map(k => `<div style="margin-top:8px"><strong>${esc(UNDERLYING_LABELS[k] || k)}</strong> <span class="small">(${groups[k].length})</span>` +
      '<div class="chips">' + groups[k].sort().map(s => `<button class="chip${on.has(s) ? " on" : ""}" data-tf="${esc(s)}">${esc(s)}</button>`).join("") +
      "</div></div>").join("");
  box.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => {
    const s = b.dataset.tf;

    if (i >= 0) { CFG.watchlist.splice(i, 1); b.classList.remove("on"); toast(s + " removed"); }
    else { CFG.watchlist.push({symbol: s, market: "futures"}); b.classList.add("on"); toast(s + " added"); }
    saveConfig(); renderWatchlist();
  });
}

function saveSettingsForm() {
  const v = id => document.getElementById(id).value.trim();
  const n = id => Number(v(id));
  const int = id => Number.isInteger(n(id)) ? n(id) : NaN;
  const errors = [];
  const next = clone(CFG);
  next.portfolio_usdt = n("pf"); if (!(next.portfolio_usdt > 0)) errors.push("Portfolio must be above 0.");
  next.risk_per_trade_pct = n("risk"); if (!(next.risk_per_trade_pct > 0 && next.risk_per_trade_pct <= 100)) errors.push("Risk per trade must be between 0 and 100.");
  next.max_position_pct = n("cap"); if (!(next.max_position_pct > 0 && next.max_position_pct <= 100)) errors.push("Max in one asset must be between 0 and 100.");
  next.fee_pct_per_trade = n("fee"); if (!(next.fee_pct_per_trade >= 0) || v("fee") === "") errors.push("Fee cannot be negative or empty.");
  next.funding_warning_annual_pct = n("fw"); if (!isFinite(next.funding_warning_annual_pct) || v("fw") === "") errors.push("Funding warning must be a number.");
  next.history_days = int("hd"); if (!(next.history_days >= 30 && next.history_days <= 5000)) errors.push("History must be a whole number from 30 to 5000.");
  const s = next.strategy;
  s.fast_sma_days = int("fast"); s.slow_sma_days = int("slow"); s.momentum_days = int("mom"); s.atr_days = int("atr");
  s.stop_atr_multiple = n("stop");
  for (const [k, label] of [["fast_sma_days", "Fast average"], ["slow_sma_days", "Slow average"], ["momentum_days", "Momentum window"], ["atr_days", "Range window"]]) {
    if (!(s[k] >= 2)) errors.push(label + " must be a whole number of 2 or more.");
  }
  if (s.fast_sma_days >= s.slow_sma_days) errors.push("Fast average must be shorter than the slow average.");
  if (!(s.stop_atr_multiple > 0)) errors.push("Stop distance must be above 0.");
  next.endpoints.spot = v("eps") || DEFAULTS.endpoints.spot;
  next.endpoints.futures = v("epf") || DEFAULTS.endpoints.futures;
  const box = document.getElementById("serr");
  if (errors.length) { box.hidden = false; box.textContent = errors.join(" "); return; }
  box.hidden = true;
  if (next.endpoints.futures !== CFG.endpoints.futures) CATALOGUE = null;
  CFG = next; saveConfig(); toast("Saved. Tap Refresh to rerun.");
}

function saveConfig() { if (!store.set("config", CFG)) toast("Could not save on this browser"); }

function renderAll() { renderStatus(); renderSignals(); renderBacktest(); renderLog(); }

document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav [data-tab]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  for (const t of ["signals", "backtest", "log", "settings"]) document.getElementById("tab-" + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === "settings") renderSettings();
  if (b.dataset.tab === "log") renderLog();
  window.scrollTo(0, 0);
});
document.getElementById("refresh").onclick = runAgent;
setInterval(renderStatus, 60000);
renderAll();
renderSettings();
// Auto-run on open if the last run is from before the latest daily close (00:00 UTC).
if (!LAST || LAST.ran_at < Math.floor(Date.now() / DAY) * DAY) runAgent();
</script>
</body>
</html>
